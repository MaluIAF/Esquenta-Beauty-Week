<title>Esquenta Beauty Week</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: faixa verde-sálvia da campanha, título em bandas inclinadas, painel claro com 4 passos (canal, praça, loja, marca) e lista de produtos. */
:root{
  --ground:#71a281;      /* verde da campanha */
  --ground-ink:#12271a;
  --logo:#ffffff;
  --red:#bf413d;
  --red-ink:#fbeceb;
  --paper:#eef5ef;       /* off-white esverdeado */
  --paper-2:#e1ece3;
  --ink:#16291d;
  --ink-2:#4a6253;
  --line:#c9d9ce;
  --ok:#2f7a4b;
  --warn:#9a5b00;
  --f-display:'Archivo','Arial Black',Arial,sans-serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#1c3326;--ground-ink:#e6f1e9;--logo:#e6f1e9;--red:#e2625c;--red-ink:#1d0b0a;--paper:#24402f;--paper-2:#2c4a38;
    --ink:#eaf4ec;--ink-2:#a9c2b1;--line:#3b5b47;--ok:#7fd29d;--warn:#f0b35a;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#1c3326;--ground-ink:#e6f1e9;--logo:#e6f1e9;--red:#e2625c;--red-ink:#1d0b0a;--paper:#24402f;--paper-2:#2c4a38;
  --ink:#eaf4ec;--ink-2:#a9c2b1;--line:#3b5b47;--ok:#7fd29d;--warn:#f0b35a;color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
.wrap{max-width:1080px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:20px;border-bottom:1px solid color-mix(in srgb,var(--ground-ink) 35%,transparent)}
.logo{display:flex;align-items:baseline;gap:.35em;color:var(--ground-ink);font-family:var(--f-display);text-decoration:none}
.logo b{font-weight:800;font-size:22px;letter-spacing:-.02em}
.logo span{font-weight:400;font-size:22px;letter-spacing:-.02em}
.logo i{width:9px;height:9px;background:var(--red);border-radius:50%;align-self:center;display:inline-block}
.dates{font-family:var(--f-display);font-stretch:112%;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ground-ink)}

/* título */
.hero{padding-block:34px 28px}
.bands{display:flex;flex-direction:column;align-items:flex-start;gap:0;font-family:var(--f-display);font-style:italic;font-weight:900;font-stretch:112%;text-transform:uppercase;line-height:1;font-size:min(9.6cqw,84px);letter-spacing:-.01em}
.band{display:inline-block;white-space:nowrap;padding:.12em .3em .08em;max-width:100%}
.band--red{background:var(--red);color:var(--red-ink);transform:rotate(-1.4deg);position:relative;z-index:1}
.band--paper{background:var(--paper);color:var(--red);transform:rotate(-.9deg);margin-top:-.04em;margin-left:-.1em}
.lead{margin:26px 0 0;max-width:56ch;font-size:18px;color:var(--ground-ink);font-weight:500}

.opt .lg{height:26px;background:var(--ink);margin-bottom:2px}
.opt.big .lg{height:34px}
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:24px;align-items:center}
.hero-t{container-type:inline-size;min-width:0}
.hero-i{width:100%;max-width:520px;justify-self:end;display:block;filter:drop-shadow(0 18px 22px rgba(0,0,0,.18))}
.dt{margin:18px 0 0;font-family:var(--f-display);font-style:italic;font-weight:800;font-stretch:112%;font-size:clamp(18px,2.4vw,26px);color:var(--ground-ink);letter-spacing:.02em}
.lead{margin-top:12px}
@media (max-width:820px){.hero{grid-template-columns:1fr}.hero-i{justify-self:center;max-width:420px}}
/* painel */
.panel{background:var(--paper);border-radius:6px;padding:20px;margin-bottom:20px}
.crumbs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px;min-height:40px}
.crumb{display:inline-flex;gap:8px;align-items:center;background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600}
.crumb small{font-weight:500;color:var(--ink-2);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.crumb:hover{border-color:var(--red)}
.crumb .x{color:var(--red);font-weight:800}
.crumbs .sep{color:var(--ink-2)}
.steps{display:flex;gap:6px;margin-bottom:22px}
.steps div{flex:1;height:6px;background:var(--line);transform:skewX(-20deg)}
.steps div.on{background:var(--red)}
.q{font-family:var(--f-display);font-style:italic;font-weight:800;font-stretch:112%;text-transform:uppercase;font-size:clamp(22px,4vw,34px);line-height:1.05;margin:0 0 6px;color:var(--red);text-wrap:balance}
.hint{margin:0 0 18px;color:var(--ink-2);font-size:15px;max-width:68ch}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.opt{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:4px;padding:16px;min-height:96px;transition:transform .12s,border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--red);transform:translateY(-2px)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt .t{font-family:var(--f-display);font-weight:800;font-stretch:108%;font-size:19px;line-height:1.1;text-transform:uppercase;letter-spacing:-.005em}
.opt .s{color:var(--ink-2);font-size:14px}
.opt .tag{margin-top:auto;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--red-ink);background:var(--red);padding:2px 8px;border-radius:2px}
.opt.big{min-height:150px;padding:22px}
.opt.big .t{font-size:clamp(24px,4vw,34px);font-style:italic}
.empty{padding:28px;border:2px dashed var(--line);border-radius:4px;color:var(--ink-2)}

/* resultado */
.rhead{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.rhead h2{margin:0;font-family:var(--f-display);font-style:italic;font-weight:900;font-stretch:112%;text-transform:uppercase;font-size:clamp(24px,4vw,38px);line-height:1;color:var(--red);text-wrap:balance}
.rhead p{margin:6px 0 0;color:var(--ink-2);font-size:14px}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kpi{background:var(--paper-2);border:1px solid var(--line);padding:8px 14px;border-radius:4px;min-width:112px}
.kpi b{display:block;font-family:var(--f-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.tools input[type=search],.tools select{font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:4px;padding:9px 12px;min-height:42px}
.tools input[type=search]{flex:1 1 240px;min-width:0}
.tools label.chk{display:inline-flex;gap:8px;align-items:center;font-size:14px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:600}
.chip[aria-pressed=true]{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.chip em{font-style:normal;opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.note{background:var(--paper-2);border-left:5px solid var(--warn);padding:10px 14px;margin-bottom:14px;font-size:14px;border-radius:0 4px 4px 0}
.tbl{border:1px solid var(--line);border-radius:4px;overflow:hidden}
.tr{display:grid;grid-template-columns:84px minmax(0,1fr) 86px 112px 74px 132px;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.tr.th{background:var(--red);color:var(--red-ink);border-top:0;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;position:sticky;top:env(safe-area-inset-top,0px);z-index:2}
.tr:not(.th):nth-child(even){background:color-mix(in srgb,var(--paper-2) 55%,transparent)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.sku{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-2);font-size:14px}
.d{min-width:0}
.d strong{display:block;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.b{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:2px;background:var(--paper-2);border:1px solid var(--line);color:var(--ink-2)}
.b.esq{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.stock{font-weight:700}
.stock.zero{color:var(--red)}
.pct{font-weight:700;color:var(--red)}
.price{font-family:var(--f-display);font-weight:800;font-size:19px;color:var(--ok)}
.price.na{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--ink-2)}
.old{display:block;font-size:12px;color:var(--ink-2);text-decoration:line-through;font-weight:500;font-family:var(--f-body)}
.more{display:block;width:100%;margin-top:12px;background:var(--red);color:var(--red-ink);border:0;border-radius:4px;padding:13px;font-weight:700;font-size:15px}
.mob{display:none}
@media (max-width:760px){
  .tr{grid-template-columns:1fr auto;grid-template-areas:"d d" "sku price" "st pct";row-gap:6px}
  .tr.th{display:none}
  .tr .d{grid-area:d}.tr .sku{grid-area:sku}.tr .c-price{grid-area:price;text-align:right}.tr .c-st{grid-area:st;text-align:left}.tr .c-pct{grid-area:pct}
  .tr .c-old{display:none}
  .mob{display:inline;color:var(--ink-2);font-weight:500;font-size:12px}
  .panel{padding:16px}
}

const CH = {VAREJO:'Varejo', VD:'Venda direta'};
const PRACAS = [['NATAL','Natal'],['SÃO LUÍS','São Luís'],['MOSSORÓ','Mossoró'],['LITORAL','Litoral'],['RN SUL','RN Sul'],['PARAÍBA','Paraíba'],['OCE','Oeste do Ceará'],['OMA','Oeste do Maranhão']];
const PNAME = Object.fromEntries(PRACAS);
const BRANDS = [['BOTICÁRIO','O Boticário'],['EUDORA','Eudora'],['QDB','Quem Disse, Berenice?'],['OUI','O.U.i']];
const BNAME = Object.fromEntries(BRANDS);
const BLOGO = {'BOTICÁRIO':0,'EUDORA':1,'QDB':2,'OUI':3};
const PERS = {esq:'Esquenta',ciclo:'Ciclo todo',pre:'Pré BW',sem:'Semana BW',fds:'FDS BW',cyber:'Cyber Monday'};
const brl = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const int = new Intl.NumberFormat('pt-BR');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const S = {ch:null, pr:null, st:null, br:null, q:'', per:'all', only:true, sort:'sku', limit:100};
const panel = document.getElementById('panel');

const storesIn = (ch,pr) => Object.entries(D.stores)
  .filter(([id,s]) => s.ch.includes(ch) && (!pr || s.p===pr) && D.stock[id])
  .sort((a,b) => a[1].n.localeCompare(b[1].n,'pt-BR'));

function rowsFor(){
  const L = (D.stock[S.st] || {})[S.br] || [];
  const cat = D.cat[S.ch][S.br];
  return L.filter(r => cat[r[0]]).map(r => {
    const [sku,qty,venda,ref] = r, [desc,pct,mech,per,vig] = cat[sku];
    return {sku,qty,venda,ref,desc,pct,mech,per,vig,price: venda>0 ? Math.round(venda*(1-pct)*100)/100 : null};
  });
}
function crumbs(){
  const parts = [];
  if(S.ch) parts.push(['ch','Canal',CH[S.ch]]);
  if(S.pr) parts.push(['pr','Praça',PNAME[S.pr]]);
  if(S.st) parts.push(['st','Loja',D.stores[S.st].n]);
  if(S.br) parts.push(['br','Marca',BNAME[S.br]]);
  return '<div class="crumbs">' + (parts.length ? parts.map(([k,l,v],i)=>
    (i?'<span class="sep" aria-hidden="true">›</span>':'')+`<button class="crumb" data-back="${k}" title="Alterar"><small>${l}</small>${esc(v)} <span class="x" aria-hidden="true">×</span></button>`).join('')
    : '<span class="crumb"><small>Comece por aqui</small>Escolha o canal</span>') + '</div>';
}
function steps(n){ return '<div class="steps" aria-hidden="true">'+[1,2,3,4].map(i=>`<div class="${i<=n?'on':''}"></div>`).join('')+'</div>'; }

function render(){
  const step = !S.ch?1 : !S.pr?2 : !S.st?3 : !S.br?4 : 5;
  let h = steps(Math.min(step,4)) + crumbs();
  if(step===1){
    h += `<h2 class="q">Qual é o seu canal?</h2><div class="grid">` +
      Object.keys(CH).map(c => { const n = storesIn(c).length;
        return `<button class="opt big" data-ch="${c}"><span class="t">${CH[c]}</span><span class="s">${n} lojas com estoque</span></button>`; }).join('') + '</div>';
  } else if(step===2){
    h += `<h2 class="q">De qual praça?</h2><p class="hint">Mostrando as praças que têm lojas de ${CH[S.ch].toLowerCase()}.</p><div class="grid">` +
      PRACAS.map(([k,l]) => { const n = storesIn(S.ch,k).length;
        return `<button class="opt" data-pr="${k}" ${n?'':'disabled'}><span class="t">${l}</span><span class="s">${n} ${n===1?'loja':'lojas'}</span></button>`; }).join('') + '</div>';
  } else if(step===3){
    const L = storesIn(S.ch,S.pr);
    h += `<h2 class="q">Qual é a sua loja?</h2><p class="hint">${L.length} ${L.length===1?'loja':'lojas'} em ${PNAME[S.pr]}.</p>` +
      (L.length ? '<div class="grid">'+L.map(([id,s]) =>
        `<button class="opt" data-st="${id}"><span class="t">${esc(s.n)}</span><span class="s">PDV ${id}</span>${s.ca==='Híbrida'||s.ca==='HUB'?`<span class="tag">${s.ca}</span>`:''}</button>`).join('')+'</div>'
        : '<div class="empty">Nenhuma loja com estoque nesta combinação.</div>');
  } else if(step===4){
    h += `<h2 class="q">Qual marca você quer consultar?</h2><p class="hint">${esc(D.stores[S.st].n)} · PDV ${S.st}</p><div class="grid">` +
      BRANDS.map(([k,l]) => { S.br=k; const r = rowsFor(); S.br=null; const u = r.reduce((a,x)=>a+x.qty,0);
        return `<button class="opt big" data-br="${k}" ${r.length?'':'disabled'}><i class="lg lg${BLOGO[k]}"></i><span class="t">${l}</span><span class="s">${r.length?`${int.format(r.length)} produtos · ${int.format(u)} un. em estoque`:'Sem itens nesta loja'}</span></button>`; }).join('') + '</div>';
  } else {
    h += results();
  }
  panel.innerHTML = h;
  bind();
}

function results(){
  let rows = rowsFor();
  const all = rows;
  const counts = {}; all.forEach(r => counts[r.per]=(counts[r.per]||0)+1);
  if(S.only) rows = rows.filter(r => r.qty>0);
  if(S.per!=='all') rows = rows.filter(r => r.per===S.per);
  if(S.q){ const q = norm(S.q); rows = rows.filter(r => String(r.sku).includes(q) || norm(r.desc).includes(q)); }
  const sorters = {sku:(a,b)=>a.sku-b.sku, desc:(a,b)=>a.desc.localeCompare(b.desc,'pt-BR'), qty:(a,b)=>b.qty-a.qty, pct:(a,b)=>b.pct-a.pct, price:(a,b)=>(a.price??1e9)-(b.price??1e9)};
  rows = rows.slice().sort(sorters[S.sort]);
  const units = rows.reduce((a,r)=>a+r.qty,0);
  const noPrice = all.filter(r=>r.price===null).length;
  const shown = rows.slice(0,S.limit);
  const s = D.stores[S.st];
  let h = `<div class="rhead"><div><h2>${BNAME[S.br]}</h2><p>${esc(s.n)} · PDV ${S.st} · ${PNAME[S.pr]} · ${CH[S.ch]}</p></div>
    <div class="kpis"><div class="kpi"><b>${int.format(rows.length)}</b><span>produtos</span></div><div class="kpi"><b>${int.format(units)}</b><span>un. em estoque</span></div></div></div>`;
  h += `<div class="tools"><input type="search" id="q" placeholder="Buscar por SKU ou descrição" value="${esc(S.q)}" aria-label="Buscar por SKU ou descrição">
    <select id="sort" aria-label="Ordenar por">${[['sku','Ordenar: SKU'],['desc','Ordenar: Descrição'],['qty','Ordenar: Maior estoque'],['pct','Ordenar: Maior desconto'],['price','Ordenar: Menor preço']].map(([v,l])=>`<option value="${v}" ${S.sort===v?'selected':''}>${l}</option>`).join('')}</select>
    <label class="chk"><input type="checkbox" id="only" ${S.only?'checked':''}> Só com estoque</label></div>`;
  const pk = Object.keys(PERS).filter(k=>counts[k]);
  if(pk.length>1) h += `<div class="chips" role="group" aria-label="Janela da promoção"><button class="chip" data-per="all" aria-pressed="${S.per==='all'}">Todas<em>${all.length}</em></button>` +
    pk.map(k=>`<button class="chip" data-per="${k}" aria-pressed="${S.per===k}">${PERS[k]}<em>${counts[k]}</em></button>`).join('')+'</div>';
  if(noPrice) h += `<div class="note">${noPrice} ${noPrice===1?'item não tem':'itens não têm'} valor de venda no relatório de estoque. Nesses, aparece só o desconto.</div>`;
  if(!rows.length) h += '<div class="empty">Nenhum produto encontrado com esses filtros.</div>';
  else {
    h += `<div class="tbl" role="table"><div class="tr th" role="row"><span>SKU</span><span>Descrição</span><span class="num">Estoque</span><span class="num">Valor de venda</span><span class="num">Desconto</span><span class="num">Valor promocional</span></div>` +
    shown.map(r => {
      const pct = (Math.round(r.pct*1000)/10).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%';
      const mech = r.mech!=='Desconto Direto' ? `<span class="b">${esc(r.mech)}</span>` : '';
      return `<div class="tr" role="row"><span class="sku" role="cell">${r.sku}</span>
        <div class="d" role="cell"><strong>${esc(r.desc)}</strong><div class="badges"><span class="b ${r.per==='esq'?'esq':''}">${PERS[r.per]}</span><span class="b">${r.vig}</span>${mech}</div></div>
        <span class="num c-st stock ${r.qty?'':'zero'}" role="cell"><span class="mob">Estoque </span>${int.format(r.qty)}</span>
        <span class="num c-old" role="cell">${r.venda>0?brl.format(r.venda)+(r.ref?'*':''):'—'}</span>
        <span class="num c-pct pct" role="cell">-${pct}</span>
        <span class="num c-price price ${r.price===null?'na':''}" role="cell">${r.price===null?'sem preço':(r.venda>0?`<span class="old mob">${brl.format(r.venda)}${r.ref?'*':''}</span>`:'')+brl.format(r.price)}</span></div>`;
    }).join('') + '</div>';
    if(rows.length>shown.length) h += `<button class="more" id="more">Mostrar mais (${int.format(rows.length-shown.length)} restantes)</button>`;
  }
  return h;
}

function bind(){
  panel.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{S.ch=b.dataset.ch;render();scrollTo0()});
  panel.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{S.pr=b.dataset.pr;render();scrollTo0()});
  panel.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{S.st=b.dataset.st;render();scrollTo0()});
  panel.querySelectorAll('[data-br]').forEach(b=>b.onclick=()=>{S.br=b.dataset.br;S.q='';S.per='all';S.limit=100;render();scrollTo0()});
  panel.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.back, order=['ch','pr','st','br'], i=order.indexOf(k);
    order.slice(i).forEach(x=>S[x]=null);
    if(k==='ch') { /* volta ao primeiro passo */ }
    S.q='';S.per='all';S.limit=100;render();
  });
  const q=document.getElementById('q'); if(q) q.oninput=()=>{S.q=q.value;S.limit=100;const p=q.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(p,p)};
  const so=document.getElementById('sort'); if(so) so.onchange=()=>{S.sort=so.value;render()};
  const on=document.getElementById('only'); if(on) on.onchange=()=>{S.only=on.checked;S.limit=100;render()};
  panel.querySelectorAll('[data-per]').forEach(b=>b.onclick=()=>{S.per=b.dataset.per;S.limit=100;render()});
  const m=document.getElementById('more'); if(m) m.onclick=()=>{S.limit+=200;render()};
}
function scrollTo0(){ try{ panel.scrollIntoView({block:'start',behavior:'smooth'}) }catch(e){} }
render();
</script>

</body></html>
